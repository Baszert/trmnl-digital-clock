---
strategy: static
no_screen_padding: 'yes'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 3.3.2
serverless_language: ''
polling_url: ''
polling_headers: ''
polling_body: ''
id: 190574
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- name: About this plugin
  keyname: author_bio
  field_type: author_bio
  description: Get the feeling of a 80's/90's digital clock, enter your location (optional), select your time format and what theme you would want. And you get a clock that is not even on time, everytime.
  category: calendar
  email_address: trmnl@achtnegen.nl
  github_url: https://github.com/Baszert/trmnl-digital-clock
- keyname: location
  name: Location
  field_type: string
  default: ''
  help_text: Enter your location name (e.g., "Amsterdam", "New York")
- keyname: time_format
  name: Time Format
  field_type: select
  default: 24h
  options:
  - 24-hour: 24h
  - 12-hour (AM/PM): 12h
- keyname: date_format
  name: Date Format
  field_type: select
  default: us
  options:
  - DD MMM YYYY: eu
  - MMM DD, YYYY: us
- keyname: color_mode
  name: Color Mode
  field_type: select
  default: dark
  options:
  - Dark: dark
  - Light: light
name: Digital Clock
description: A clock that is never on time.
refresh_interval: 15
